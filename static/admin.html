<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin – Biogas RAG</title>
<style>
  :root {
    --bg: #f5f5f5; --fg: #1a1a1a; --muted: #666;
    --accent: #2563eb; --accent-hover: #1d4ed8;
    --card-bg: #fff; --border: #ddd; --radius: 8px;
    --danger: #dc2626; --danger-hover: #b91c1c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg); min-height: 100dvh; }

  /* Login */
  #login-view { display: flex; align-items: center; justify-content: center; min-height: 100dvh; }
  .login-card {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 2rem; width: 100%; max-width: 360px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  .login-card h2 { font-size: 1.1rem; margin-bottom: 1.5rem; }
  .login-card label { display: block; font-size: 0.85rem; margin-bottom: 0.25rem; color: var(--muted); }
  .login-card input {
    width: 100%; padding: 0.5rem 0.6rem; border: 1px solid var(--border);
    border-radius: 4px; font-size: 0.95rem; margin-bottom: 0.75rem;
  }
  .error { color: var(--danger); font-size: 0.85rem; margin-top: 0.5rem; display: none; }

  /* Admin panel */
  #admin-view { display: none; max-width: 960px; margin: 0 auto; padding: 2rem 1rem; }
  .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
  .admin-header h1 { font-size: 1.3rem; }

  /* Add user form */
  .add-form {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1.25rem; margin-bottom: 2rem;
    display: flex; gap: 0.75rem; align-items: flex-end; flex-wrap: wrap;
  }
  .add-form .field { display: flex; flex-direction: column; gap: 0.25rem; flex: 1; min-width: 160px; }
  .add-form label { font-size: 0.82rem; color: var(--muted); }
  .add-form input {
    padding: 0.5rem 0.6rem; border: 1px solid var(--border);
    border-radius: 4px; font-size: 0.9rem;
  }
  .add-error { width: 100%; color: var(--danger); font-size: 0.82rem; display: none; }

  /* Users table */
  .table-wrap { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th { text-align: left; padding: 0.6rem 1rem; background: #fafafa; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 0.82rem; color: var(--muted); }
  td { padding: 0.65rem 1rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafafa; }
  .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 99px; font-size: 0.78rem; font-weight: 500; }
  .badge-yes { background: #dcfce7; color: #166534; }
  .badge-no  { background: #f1f5f9; color: var(--muted); }
  .empty { text-align: center; padding: 2rem; color: var(--muted); font-size: 0.9rem; }

  /* Buttons */
  .btn {
    padding: 0.5rem 1rem; border: none; border-radius: 4px;
    font-size: 0.88rem; cursor: pointer; font-weight: 500;
    transition: background 0.15s; white-space: nowrap;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-secondary { background: var(--bg); color: var(--fg); border: 1px solid var(--border); }
  .btn-secondary:hover { background: var(--border); }
  .btn-danger { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }
  .btn-danger:hover { background: var(--danger); color: #fff; }
  .btn-sm { padding: 0.3rem 0.65rem; font-size: 0.82rem; }
</style>
</head>
<body>

<!-- Login -->
<div id="login-view">
  <div class="login-card">
    <h2>Admin – Biogas RAG</h2>
    <label for="admin-email">E-post</label>
    <input type="email" id="admin-email" autocomplete="username">
    <label for="admin-password">Lösenord</label>
    <input type="password" id="admin-password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doAdminLogin()">
    <button class="btn btn-primary" style="width:100%;margin-top:0.25rem" onclick="doAdminLogin()">Logga in</button>
    <p class="error" id="login-error"></p>
  </div>
</div>

<!-- Admin panel -->
<div id="admin-view">
  <div class="admin-header">
    <h1>Användare</h1>
    <button class="btn btn-secondary" onclick="doAdminLogout()">Logga ut</button>
  </div>

  <div class="add-form">
    <div class="field">
      <label for="new-name">Namn</label>
      <input type="text" id="new-name" placeholder="Anna Andersson">
    </div>
    <div class="field">
      <label for="new-email">E-post</label>
      <input type="email" id="new-email" placeholder="anna@example.com" onkeydown="if(event.key==='Enter')doAddUser()">
    </div>
    <button class="btn btn-primary" onclick="doAddUser()">Lägg till</button>
    <p class="add-error" id="add-error"></p>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Namn</th>
          <th>E-post</th>
          <th>Datainsamling</th>
          <th>Registrerad</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="users-tbody">
        <tr><td colspan="6" class="empty">Laddar...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const loginView = document.getElementById("login-view");
const adminView = document.getElementById("admin-view");
const loginError = document.getElementById("login-error");
const addError = document.getElementById("add-error");
const tbody = document.getElementById("users-tbody");

async function loadUsers() {
  const res = await fetch("/api/admin/users");
  if (res.status === 401) {
    showLogin();
    return;
  }
  const users = await res.json();
  showPanel();
  renderUsers(users);
}

function showLogin() {
  adminView.style.display = "none";
  loginView.style.display = "flex";
}

function showPanel() {
  loginView.style.display = "none";
  adminView.style.display = "block";
}

function renderUsers(users) {
  if (!users.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty">Inga användare ännu.</td></tr>';
    return;
  }
  tbody.innerHTML = users.map(u => `
    <tr>
      <td>${u.id}</td>
      <td>${esc(u.name || "—")}</td>
      <td>${esc(u.email)}</td>
      <td><span class="badge ${u.allow_logging ? 'badge-yes' : 'badge-no'}">${u.allow_logging ? 'Ja' : 'Nej'}</span></td>
      <td>${esc(u.created_at ? u.created_at.replace('T', ' ').slice(0, 16) : '—')}</td>
      <td><button class="btn btn-danger btn-sm" onclick="doDeleteUser(${u.id}, ${JSON.stringify(u.email)})">Ta bort</button></td>
    </tr>
  `).join("");
}

function esc(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

async function doAdminLogin() {
  loginError.style.display = "none";
  const email = document.getElementById("admin-email").value.trim();
  const password = document.getElementById("admin-password").value;
  const res = await fetch("/api/admin/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({email, password}),
  });
  if (!res.ok) {
    const err = await res.json();
    loginError.textContent = err.detail || "Inloggning misslyckades.";
    loginError.style.display = "block";
    return;
  }
  await loadUsers();
}

async function doAdminLogout() {
  await fetch("/api/admin/logout", {method: "POST"});
  showLogin();
}

async function doAddUser() {
  addError.style.display = "none";
  const name = document.getElementById("new-name").value.trim();
  const email = document.getElementById("new-email").value.trim();
  const res = await fetch("/api/admin/users", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({name, email}),
  });
  if (!res.ok) {
    const err = await res.json();
    addError.textContent = err.detail || "Kunde inte lägga till användare.";
    addError.style.display = "block";
    return;
  }
  document.getElementById("new-name").value = "";
  document.getElementById("new-email").value = "";
  await loadUsers();
}

async function doDeleteUser(id, email) {
  if (!confirm(`Ta bort ${email}?`)) return;
  const res = await fetch(`/api/admin/users/${id}`, {method: "DELETE"});
  if (!res.ok) {
    const err = await res.json();
    alert(err.detail || "Kunde inte ta bort användaren.");
    return;
  }
  await loadUsers();
}

loadUsers();
</script>
</body>
</html>
